name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run format:check
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: itops_test
          POSTGRES_USER: itops
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itops -d itops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ITOPS_DATABASE_URL: postgresql+psycopg://itops:test-only-password@localhost:5432/itops_test
      ITOPS_TEST_DATABASE_URL: postgresql+psycopg://itops:test-only-password@localhost:5432/itops_test
      ITOPS_JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit
      - run: alembic upgrade head
      - run: alembic check
      - run: ruff check .
      - run: mypy app
      - run: mkdir -p test-results
      - run: pytest --junitxml=test-results/backend-junit.xml --cov-report=xml:test-results/backend-coverage.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/test-results
          if-no-files-found: error
          retention-days: 14

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy itops_agent
      - run: mkdir -p test-results
      - run: pytest --junitxml=test-results/agent-junit.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-test-results
          path: agent/test-results
          if-no-files-found: error
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: itops
      POSTGRES_USER: itops
      POSTGRES_PASSWORD: ci-only-password
      ITOPS_DATABASE_URL: postgresql+psycopg://itops:ci-only-password@database:5432/itops
      ITOPS_JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
      ITOPS_CORS_ORIGINS: '["https://support.example.test"]'
      ITOPS_ATTACHMENT_CLAMAV_HOST: clamav.example.test
      ITOPS_API_IMAGE: example/itops-api:ci
      ITOPS_FRONTEND_IMAGE: example/itops-frontend:ci
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose build
