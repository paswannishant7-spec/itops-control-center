[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "itops-device-agent"
version = "0.1.0"
description = "Minimal secure endpoint health agent for ITOps Control Center"
requires-python = ">=3.12,<3.15"
dependencies = ["psutil==7.2.2"]

[project.scripts]
itops-device-agent = "itops_agent.main:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "mypy==1.18.2", "ruff==0.16.9"]

[tool.hatch.build.targets.wheel]
packages = ["itops_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true
