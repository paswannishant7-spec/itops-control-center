[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "itops-control-center-api"
version = "0.1.0"
description = "API foundation for the ITOps Control Center"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.19.2",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "pgvector==0.5.0",
  "psycopg[binary,pool]==3.3.6",
  "pydantic-settings==2.15.0",
  "pyjwt==2.15.1",
  "sqlalchemy[asyncio]==2.0.52",
  "structlog==26.1.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "mypy==1.18.2",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.13.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
